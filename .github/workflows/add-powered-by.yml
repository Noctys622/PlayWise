name: Ajouter Powered by

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-powered-by.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ajouter la signature au footer
        shell: python
        run: |
          from pathlib import Path

          files = ['index.html', 'guides.html', 'avis.html']
          powered = '<br><span style="display:inline-block;margin-top:7px;font-size:.75rem;color:#7f93ad">Powered by <strong style="color:#b9c8da">J2 &amp; Noctys</strong></span>'

          for name in files:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              if 'Powered by J2' in text or 'Powered by <strong style="color:#b9c8da">J2' in text:
                  print(f'{name}: déjà présent')
                  continue
              marker = '© 2026 PlayWise'
              pos = text.find(marker)
              if pos == -1:
                  print(f'{name}: copyright non trouvé')
                  continue
              # Place la signature juste après le texte de copyright, sans toucher aux liens du footer.
              end_candidates = [
                  text.find('</div>', pos),
                  text.find('</p>', pos),
                  text.find('</span>', pos),
                  text.find('</footer>', pos),
              ]
              end_candidates = [x for x in end_candidates if x != -1]
              if not end_candidates:
                  continue
              end = min(end_candidates)
              text = text[:end] + powered + text[end:]
              p.write_text(text, encoding='utf-8')
              print(f'{name}: modifié')

      - name: Commit et push
        run: |
          if git diff --quiet; then
            echo "Aucun changement"
            exit 0
          fi
          git config user.name "PlayWise Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html guides.html avis.html
          git commit -m "Afficher Powered by J2 & Noctys"
          git push
