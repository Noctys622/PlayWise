name: PlayWise V3
on:
  push:
    branches: [main]
    paths: ['.github/workflows/playwise-v3.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Générer PlayWise V3
        shell: python
        run: |
          from pathlib import Path
          import json, re

          ROOT=Path('.')
          def write(path, text):
              p=ROOT/path; p.parent.mkdir(parents=True,exist_ok=True); p.write_text(text,encoding='utf-8')

          CSS='/assets/playwise.css'
          JS='/assets/playwise.js'
          def head(title, desc):
              return f'''<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06101c"><meta name="description" content="{desc}"><title>{title} — PlayWise</title><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="{CSS}"></head><body class="pw-page">'''
          def nav():
              return '''<header class="pw-top"><div class="pw-shell pw-head"><a class="pw-brand" href="/"><span class="pw-brand-badge">P</span><span>PlayWise</span></a><nav class="pw-nav"><a href="/guides.html">Guides</a><a href="/avis.html">Avis</a><a href="/reglement.html">Règlement</a><a href="/support.html">Support</a><a href="https://discord.gg/pPjbT5F79a" target="_blank">Discord</a></nav><div class="pw-actions"><a data-pw-login class="pw-btn discord" href="/api/discord/login">Connexion Discord</a><button data-pw-profile class="pw-btn pw-profile-chip"><img alt=""><span data-name>Profil</span></button></div></div></header>'''
          def end(extra=''):
              return extra+f'''<script src="{JS}" defer></script></body></html>'''

          profile=head('Profil','Ton espace personnel PlayWise.')+nav()+'''<main class="pw-main"><div class="pw-shell"><section class="pw-hero"><div class="pw-kicker">ESPACE PERSONNEL</div><h1 class="pw-title">Ton profil <span class="accent">PlayWise.</span></h1><p class="pw-lead">Retrouve ton compte Discord, tes favoris et ton historique de lecture.</p></section><div class="pw-grid two"><section class="pw-card"><h2>Compte Discord</h2><div id="userBox" class="pw-notice">Vérification de ta session…</div><div class="pw-row" style="margin-top:16px"><a class="pw-btn primary" href="/guides.html">Explorer les guides</a><button data-pw-logout class="pw-btn danger">Déconnexion</button></div></section><section class="pw-card"><h2>Ta bibliothèque</h2><div class="pw-grid two"><div class="pw-stat"><strong id="favCount">0</strong><span>Favoris</span></div><div class="pw-stat"><strong id="histCount">0</strong><span>Guides consultés</span></div></div></section><section class="pw-card"><h2>Favoris</h2><div id="favs" class="pw-list"></div></section><section class="pw-card"><h2>Historique</h2><div id="history" class="pw-list"></div></section></div></div></main>'''+end('''<script>document.addEventListener('pw:session',e=>{const u=e.detail,b=document.getElementById('userBox');if(!u){b.className='pw-notice warn';b.innerHTML='Tu n’es pas connecté. <a href="/api/discord/login"><b>Connexion Discord</b></a>';return}b.className='pw-user';b.innerHTML=`<img src="${u.avatarUrl||''}" alt=""><div><strong>${u.global_name||u.username}</strong><span>@${u.username||''}</span><span class="pw-badge">${u.admin?'Administrateur PlayWise':'Membre PlayWise'}</span></div>`});document.addEventListener('DOMContentLoaded',()=>{const f=PW.getFavorites(),h=PW.getHistory();favCount.textContent=f.length;histCount.textContent=h.length;favs.innerHTML=f.length?f.map(x=>`<a href="/guides.html?q=${encodeURIComponent(x.title||x.slug||'')}"><span>❤️ ${x.title||x.slug}</span><span>→</span></a>`).join(''):'<div class="pw-muted">Aucun favori pour le moment.</div>';history.innerHTML=h.length?h.slice(0,8).map(x=>`<a href="/guides.html?q=${encodeURIComponent(x.title||x.slug||'')}"><span>🕘 ${x.title||x.slug}</span><span>→</span></a>`).join(''):'<div class="pw-muted">Ton historique est vide.</div>'});</script>''')
          write(Path('profil.html'),profile)

          rules=head('Règlement','Règlement officiel PlayWise.')+nav()+'''<main class="pw-main"><div class="pw-shell"><section class="pw-hero"><div class="pw-kicker">COMMUNAUTÉ</div><h1 class="pw-title">Règlement <span class="accent">PlayWise.</span></h1><p class="pw-lead">Consulte le règlement officiel directement depuis le site. Le document ci-dessous reste synchronisé avec le Google Doc d’origine.</p><div class="pw-row"><a class="pw-btn primary" target="_blank" href="https://docs.google.com/document/d/1A8JN-LuCmUUgpT-G0kTN6hJS72dyfcZ8269gfW5XL_I/edit?usp=drivesdk">Ouvrir le document ↗</a><a class="pw-btn" href="https://discord.gg/pPjbT5F79a" target="_blank">Rejoindre Discord</a></div></section><section class="pw-card"><div class="pw-notice">En utilisant PlayWise et sa communauté Discord, tu acceptes de respecter ce règlement.</div><iframe class="pw-frame" style="margin-top:16px" title="Règlement PlayWise" src="https://docs.google.com/document/d/1A8JN-LuCmUUgpT-G0kTN6hJS72dyfcZ8269gfW5XL_I/preview"></iframe></section></div></main>'''+end()
          write(Path('reglement.html'),rules)

          support=head('Support','Contacte le support PlayWise.')+nav()+'''<main class="pw-main"><div class="pw-shell"><section class="pw-hero"><div class="pw-kicker">AIDE</div><h1 class="pw-title">Besoin d’un <span class="accent">coup de main ?</span></h1><p class="pw-lead">Envoie une demande depuis le site. Si le webhook support est configuré, elle arrivera directement sur Discord avec ton identité vérifiée.</p></section><div class="pw-grid two"><section class="pw-card"><h2>Contacter le support</h2><form id="supportForm" class="pw-form"><div class="pw-field"><label>Catégorie</label><select id="category"><option>Problème avec le site</option><option>Guide / jeu</option><option>Compte Discord</option><option>Partenariat</option><option>Autre</option></select></div><div class="pw-field"><label>Sujet</label><input id="subject" maxlength="100" required placeholder="Décris le problème en quelques mots"></div><div class="pw-field"><label>Message</label><textarea id="message" maxlength="1200" required placeholder="Explique ce dont tu as besoin…"></textarea></div><button class="pw-btn primary" type="submit">Envoyer au support</button><div id="result"></div></form></section><aside class="pw-card"><h2>Support Discord</h2><p class="pw-muted">Pour une réponse rapide, tu peux aussi rejoindre directement la communauté PlayWise.</p><a class="pw-btn discord" target="_blank" href="https://discord.gg/pPjbT5F79a">Ouvrir Discord</a><div class="pw-notice" style="margin-top:18px">🔒 Les formulaires sensibles nécessitent une connexion Discord et les webhooks restent cachés côté serveur.</div></aside></div></div></main>'''+end('''<script>supportForm.addEventListener('submit',async e=>{e.preventDefault();result.className='pw-notice';result.textContent='Envoi…';try{const r=await fetch('/api/support',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({category:category.value,subject:subject.value,message:message.value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Erreur');result.className='pw-notice good';result.textContent='Demande envoyée sur Discord ✅';supportForm.reset()}catch(err){result.className='pw-notice bad';result.textContent=err.message}}</script>''')
          write(Path('support.html'),support)

          status=head('Statut','État des services PlayWise.')+nav()+'''<main class="pw-main"><div class="pw-shell"><section class="pw-hero"><div class="pw-kicker">STATUS</div><h1 class="pw-title">État des <span class="accent">services.</span></h1><p class="pw-lead">Vérifie rapidement si le site et la connexion à la communauté Discord répondent normalement.</p></section><div class="pw-grid"><div class="pw-card"><h3><span id="siteDot" class="pw-status-dot"></span> Site PlayWise</h3><p id="siteText" class="pw-muted">Vérification…</p></div><div class="pw-card"><h3><span id="discordDot" class="pw-status-dot"></span> Discord</h3><p id="discordText" class="pw-muted">Vérification…</p></div><div class="pw-card"><h3>Communauté</h3><p class="pw-muted"><strong id="members">—</strong> membres · <strong id="online">—</strong> en ligne</p></div></div></div></main>'''+end('''<script>fetch('/api/status',{cache:'no-store'}).then(r=>r.json()).then(d=>{siteDot.className='pw-status-dot ok';siteText.textContent='Opérationnel';if(d.discord?.ok){discordDot.className='pw-status-dot ok';discordText.textContent=d.discord.name||'Discord opérationnel';members.textContent=d.discord.members??'—';online.textContent=d.discord.online??'—'}else{discordDot.className='pw-status-dot bad';discordText.textContent='Informations Discord indisponibles'}}).catch(()=>{siteDot.className='pw-status-dot bad';siteText.textContent='Erreur de vérification'})</script>''')
          write(Path('statut.html'),status)

          admin=head('Administration','Administration sécurisée PlayWise.')+nav()+'''<main class="pw-main"><div class="pw-shell"><section class="pw-hero"><div class="pw-kicker">ADMINISTRATION</div><h1 class="pw-title">Centre de <span class="accent">contrôle.</span></h1><p class="pw-lead">Accessible uniquement aux administrateurs reconnus via Discord.</p></section><div id="denied" class="pw-notice warn">Vérification des droits administrateur…</div><div id="adminArea" style="display:none" class="pw-grid two"><section class="pw-card"><h2>Annonce Discord</h2><form id="announceForm" class="pw-form"><div class="pw-field"><label>Titre</label><input id="announceTitle" maxlength="100" placeholder="Nouvelle mise à jour PlayWise"></div><div class="pw-field"><label>Message</label><textarea id="announceMessage" maxlength="1500" required></textarea></div><button class="pw-btn primary">Publier sur Discord</button><div id="announceResult"></div></form></section><section class="pw-card"><h2>Accès rapides</h2><div class="pw-list"><a href="/guides.html"><span>📚 Bibliothèque des guides</span><span>→</span></a><a href="/avis.html"><span>⭐ Avis</span><span>→</span></a><a href="/reglement.html"><span>📜 Règlement</span><span>→</span></a><a href="/statut.html"><span>📡 Statut des services</span><span>→</span></a></div></section><section class="pw-card"><h2>Sécurité</h2><p class="pw-muted">Les actions administrateur sont revérifiées côté serveur. Modifier le HTML dans le navigateur ne donne aucun droit supplémentaire.</p></section><section class="pw-card"><h2>Publication de contenu</h2><p class="pw-muted">La gestion persistante des guides nécessite une base de données/CMS. La structure V3 est prête pour l’ajouter sans exposer de secret.</p></section></div></div></main>'''+end('''<script>document.addEventListener('pw:session',e=>{const u=e.detail;if(!u?.admin){denied.className='pw-notice bad';denied.textContent='Accès refusé : compte administrateur Discord requis.';return}denied.style.display='none';adminArea.style.display='grid'});announceForm?.addEventListener('submit',async e=>{e.preventDefault();announceResult.className='pw-notice';announceResult.textContent='Publication…';try{const r=await fetch('/api/announce',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:announceTitle.value,message:announceMessage.value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Erreur');announceResult.className='pw-notice good';announceResult.textContent='Annonce publiée ✅';announceForm.reset()}catch(err){announceResult.className='pw-notice bad';announceResult.textContent=err.message}})</script>''')
          write(Path('admin.html'),admin)

          privacy=head('Confidentialité','Politique de confidentialité PlayWise.')+nav()+'''<main class="pw-main"><div class="pw-shell"><section class="pw-hero"><div class="pw-kicker">VIE PRIVÉE</div><h1 class="pw-title">Confidentialité.</h1><p class="pw-lead">PlayWise limite les données collectées au strict nécessaire pour faire fonctionner la connexion Discord et les fonctionnalités du site.</p></section><div class="pw-card"><h2>Données utilisées</h2><p class="pw-muted">Lors d’une connexion Discord, PlayWise peut traiter ton identifiant Discord, ton pseudo, ton avatar et l’information permettant de déterminer tes droits administrateur sur le serveur. Une session signée est stockée dans un cookie HTTP sécurisé.</p><h2>Finalités</h2><p class="pw-muted">Ces informations servent à afficher ton profil, protéger les fonctions administrateur, authentifier les avis et les demandes de support. Les secrets Discord et webhooks restent côté serveur.</p><h2>Stockage local</h2><p class="pw-muted">Les favoris et l’historique de guides peuvent être enregistrés dans le stockage local de ton navigateur. Tu peux les supprimer en effaçant les données du site.</p><h2>Discord</h2><p class="pw-muted">Les fonctionnalités Discord restent soumises aux propres conditions et règles de confidentialité de Discord.</p></div></div></main>'''+end()
          write(Path('confidentialite.html'),privacy)

          terms=head('Conditions','Conditions d’utilisation PlayWise.')+nav()+'''<main class="pw-main"><div class="pw-shell"><section class="pw-hero"><div class="pw-kicker">UTILISATION</div><h1 class="pw-title">Conditions <span class="accent">PlayWise.</span></h1></section><div class="pw-card"><h2>Utilisation du service</h2><p class="pw-muted">PlayWise fournit des guides et outils communautaires à titre informatif. Les utilisateurs doivent respecter le règlement PlayWise, Discord et les règles des jeux/services concernés.</p><h2>Contenus</h2><p class="pw-muted">Les guides peuvent évoluer avec les mises à jour des jeux. Vérifie toujours les informations sensibles avant d’effectuer une modification importante sur ton appareil ou ton compte.</p><h2>Comportement</h2><p class="pw-muted">Le spam, l’abus des formulaires, l’usurpation d’identité et toute tentative de contourner les protections du site peuvent entraîner une restriction d’accès.</p><h2>Modifications</h2><p class="pw-muted">PlayWise peut faire évoluer ces conditions et ses fonctionnalités au fil du développement de la plateforme.</p></div></div></main>'''+end()
          write(Path('conditions.html'),terms)

          notfound=head('Page introuvable','Page introuvable sur PlayWise.')+nav()+'''<main class="pw-main"><div class="pw-shell"><section class="pw-hero"><div class="pw-kicker">ERREUR 404</div><h1 class="pw-title">Cette page a <span class="accent">disparu.</span></h1><p class="pw-lead">Le lien est peut-être ancien ou incorrect. Retourne à l’accueil ou cherche directement dans les guides.</p><div class="pw-row"><a class="pw-btn primary" href="/">Retour à l’accueil</a><a class="pw-btn" href="/guides.html">Voir les guides</a></div></section></div></main>'''+end()
          write(Path('404.html'),notfound)

          manifest={"name":"PlayWise","short_name":"PlayWise","description":"Guides, astuces et communauté gaming.","start_url":"/","display":"standalone","background_color":"#06101c","theme_color":"#3b8cff","icons":[{"src":"/favicon.svg","sizes":"any","type":"image/svg+xml","purpose":"any maskable"}]}
          write(Path('manifest.webmanifest'),json.dumps(manifest,ensure_ascii=False,indent=2))
          write(Path('favicon.svg'),'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5367ff"/><stop offset="1" stop-color="#20264f"/></linearGradient></defs><rect width="512" height="512" rx="120" fill="url(#g)"/><path d="M155 116h126c83 0 132 43 132 113 0 73-53 117-139 117h-44v70h-75V116zm75 64v102h43c42 0 64-17 64-52 0-34-22-50-64-50h-43z" fill="#fff"/></svg>''')
          write(Path('sw.js'),'''const C='playwise-v3';const CORE=['/','/guides.html','/avis.html','/reglement.html','/support.html','/profil.html','/assets/playwise.css','/assets/playwise.js','/favicon.svg'];self.addEventListener('install',e=>e.waitUntil(caches.open(C).then(c=>c.addAll(CORE)).catch(()=>{})));self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==C).map(k=>caches.delete(k))))));self.addEventListener('fetch',e=>{if(e.request.method!=='GET'||new URL(e.request.url).pathname.startsWith('/api/'))return;e.respondWith(fetch(e.request).then(r=>{const x=r.clone();caches.open(C).then(c=>c.put(e.request,x));return r}).catch(()=>caches.match(e.request).then(r=>r||caches.match('/404.html'))))});''')

          announce='''const crypto=require('node:crypto');const hits=new Map();function verify(t,s){try{if(!t||!s)return null;const[p,x]=t.split('.');const e=crypto.createHmac('sha256',s).update(p).digest('base64url');const a=Buffer.from(x||''),b=Buffer.from(e);if(a.length!==b.length||!crypto.timingSafeEqual(a,b))return null;const o=JSON.parse(Buffer.from(p,'base64url').toString());return o.exp>Date.now()?o:null}catch{return null}}function clean(v,n){return String(v||'').replace(/\\r/g,'').trim().slice(0,n)}module.exports=async(req,res)=>{res.setHeader('Cache-Control','no-store');if(req.method!=='POST')return res.status(405).json({error:'Méthode non autorisée.'});const c=req.headers.cookie||'';const m=c.match(/(?:^|; )pw_session=([^;]+)/);const u=verify(m?.[1],process.env.DISCORD_CLIENT_SECRET);if(!u?.admin)return res.status(403).json({error:'Droits administrateur requis.'});const now=Date.now(),last=hits.get(u.id)||0;if(now-last<15000)return res.status(429).json({error:'Attends quelques secondes avant une nouvelle annonce.'});const hook=process.env.DISCORD_WEBHOOK_URL;if(!hook)return res.status(503).json({error:'DISCORD_WEBHOOK_URL n’est pas configuré.'});let b=req.body;if(typeof b==='string')try{b=JSON.parse(b)}catch{};const title=clean(b?.title,100)||'Annonce PlayWise',message=clean(b?.message,1500);if(message.length<3)return res.status(400).json({error:'Message trop court.'});const r=await fetch(hook,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'PlayWise',allowed_mentions:{parse:[]},embeds:[{title,description:message,color:3894527,footer:{text:`Publié par ${u.global_name||u.username}`},timestamp:new Date().toISOString()}]})}).catch(()=>null);if(!r?.ok)return res.status(502).json({error:'Discord n’a pas accepté l’annonce.'});hits.set(u.id,now);res.json({ok:true})};'''
          write(Path('api/announce.js'),announce)

          supportapi='''const crypto=require('node:crypto');const hits=new Map();function verify(t,s){try{if(!t||!s)return null;const[p,x]=t.split('.');const e=crypto.createHmac('sha256',s).update(p).digest('base64url');const a=Buffer.from(x||''),b=Buffer.from(e);if(a.length!==b.length||!crypto.timingSafeEqual(a,b))return null;const o=JSON.parse(Buffer.from(p,'base64url').toString());return o.exp>Date.now()?o:null}catch{return null}}function clean(v,n){return String(v||'').replace(/\\r/g,'').trim().slice(0,n)}module.exports=async(req,res)=>{res.setHeader('Cache-Control','no-store');if(req.method!=='POST')return res.status(405).json({error:'Méthode non autorisée.'});const c=req.headers.cookie||'',m=c.match(/(?:^|; )pw_session=([^;]+)/),u=verify(m?.[1],process.env.DISCORD_CLIENT_SECRET);if(!u)return res.status(401).json({error:'Connecte-toi avec Discord avant de contacter le support.'});const now=Date.now(),last=hits.get(u.id)||0;if(now-last<120000)return res.status(429).json({error:'Une demande a déjà été envoyée récemment.'});let b=req.body;if(typeof b==='string')try{b=JSON.parse(b)}catch{};const category=clean(b?.category,60),subject=clean(b?.subject,100),message=clean(b?.message,1200);if(subject.length<3||message.length<10)return res.status(400).json({error:'Complète le sujet et le message.'});const hook=process.env.DISCORD_SUPPORT_WEBHOOK_URL||process.env.DISCORD_WEBHOOK_URL;if(!hook)return res.status(503).json({error:'Le canal de support n’est pas encore configuré.'});const r=await fetch(hook,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'PlayWise • Support',allowed_mentions:{parse:[]},embeds:[{title:`🛟 ${subject}`,description:message,color:3894527,author:{name:u.global_name||u.username,icon_url:u.avatarUrl||undefined},fields:[{name:'Catégorie',value:category||'Autre',inline:true},{name:'Discord',value:`<@${String(u.id).replace(/\\D/g,'')}>`,inline:true}],timestamp:new Date().toISOString()}]})}).catch(()=>null);if(!r?.ok)return res.status(502).json({error:'Impossible d’envoyer la demande à Discord.'});hits.set(u.id,now);res.json({ok:true})};'''
          write(Path('api/support.js'),supportapi)

          statusapi='''module.exports=async(req,res)=>{res.setHeader('Cache-Control','no-store, max-age=0');try{const r=await fetch('https://discord.com/api/v10/invites/pPjbT5F79a?with_counts=true');const d=r.ok?await r.json():null;res.json({site:{ok:true},discord:{ok:!!d,name:d?.guild?.name||null,members:d?.approximate_member_count??null,online:d?.approximate_presence_count??null}})}catch{res.json({site:{ok:true},discord:{ok:false}})}};'''
          write(Path('api/status.js'),statusapi)

          # Header / cache / security Vercel
          vercel={"cleanUrls":True,"trailingSlash":False,"headers":[{"source":"/(.*)","headers":[{"key":"X-Content-Type-Options","value":"nosniff"},{"key":"Referrer-Policy","value":"strict-origin-when-cross-origin"},{"key":"Permissions-Policy","value":"camera=(), microphone=(), geolocation=()"}]},{"source":"/assets/(.*)","headers":[{"key":"Cache-Control","value":"public, max-age=86400, stale-while-revalidate=604800"}]}]}
          write(Path('vercel.json'),json.dumps(vercel,indent=2))

          # JS global : adapte les anciennes pages sans dupliquer leurs footers.
          commonjs='''(()=>{const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let deferredInstall=null;window.PW={user:null,getFavorites(){try{return JSON.parse(localStorage.getItem('pw_favs')||'[]')}catch{return[]}},getHistory(){try{return JSON.parse(localStorage.getItem('pw_history')||'[]')}catch{return[]}},saveHistory(i){let h=PW.getHistory().filter(x=>x.slug!==i.slug);h.unshift({...i,at:Date.now()});localStorage.setItem('pw_history',JSON.stringify(h.slice(0,20)))}};async function session(){try{const r=await fetch('/api/session',{cache:'no-store'}),d=await r.json();PW.user=d.user||null;document.dispatchEvent(new CustomEvent('pw:session',{detail:PW.user}));const login=$('[data-pw-login]'),chip=$('[data-pw-profile]');if(PW.user){if(login)login.style.display='none';if(chip){chip.classList.add('show');const img=chip.querySelector('img'),name=chip.querySelector('[data-name]');if(img)img.src=PW.user.avatarUrl||'';if(name)name.textContent=PW.user.global_name||PW.user.username||'Profil';chip.onclick=()=>location.href='/profil.html'}}else if(login)login.style.display='inline-flex'}catch{}}function upgradeFooter(){let f=document.querySelector('footer');if(!f){f=document.createElement('footer');f.className='pw-footer';document.body.appendChild(f)}if(!f.querySelector('[data-pw-legal]')){const x=document.createElement('div');x.setAttribute('data-pw-legal','');x.style.cssText='margin-top:10px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:.78rem';x.innerHTML='<span>Powered by <b>J2 & Noctys</b></span><a href="/reglement.html">Règlement</a><a href="/support.html">Support</a><a href="/statut.html">Statut</a><a href="/conditions.html">Conditions</a><a href="/confidentialite.html">Confidentialité</a>';f.appendChild(x)}}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;let b=$('[data-pw-install]');if(b)b.classList.add('show')});document.addEventListener('click',async e=>{const b=e.target.closest('[data-pw-install]');if(b&&deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;b.classList.remove('show')}if(e.target.closest('[data-pw-logout]')){e.preventDefault();await fetch('/api/logout',{method:'POST'}).catch(()=>{});location.href='/'}});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));document.addEventListener('DOMContentLoaded',()=>{session();upgradeFooter();if(!document.querySelector('[data-pw-install]')){const b=document.createElement('button');b.className='pw-btn primary pw-install';b.setAttribute('data-pw-install','');b.textContent='⬇ Installer PlayWise';document.body.appendChild(b)}})})();'''
          write(Path('assets/playwise.js'),commonjs)

          # Patcher les 3 pages existantes sans réécrire leur contenu.
          for filename in ['index.html','guides.html','avis.html']:
              p=Path(filename)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              if 'manifest.webmanifest' not in s:
                  s=s.replace('</head>','<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/favicon.svg"></head>',1)
              if '/assets/playwise.js' not in s:
                  s=s.replace('</body>','<script src="/assets/playwise.js" defer></script></body>',1)
              # Navigation Règlement/Support : ajoute une seule fois après Avis si possible.
              if '/reglement.html' not in s:
                  s=re.sub(r'(<a[^>]+href=["\']/avis\.html["\'][^>]*>Avis</a>)',r'\1<a href="/reglement.html">Règlement</a><a href="/support.html">Support</a>',s,count=1)
              p.write_text(s,encoding='utf-8')

          sitemap='''<?xml version="1.0" encoding="UTF-8"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>https://playwise-ps4tvw8g2k-9935s-projects.vercel.app/</loc></url><url><loc>https://playwise-ps4tvw8g2k-9935s-projects.vercel.app/guides.html</loc></url><url><loc>https://playwise-ps4tvw8g2k-9935s-projects.vercel.app/avis.html</loc></url><url><loc>https://playwise-ps4tvw8g2k-9935s-projects.vercel.app/reglement.html</loc></url><url><loc>https://playwise-ps4tvw8g2k-9935s-projects.vercel.app/support.html</loc></url><url><loc>https://playwise-ps4tvw8g2k-9935s-projects.vercel.app/statut.html</loc></url><url><loc>https://playwise-ps4tvw8g2k-9935s-projects.vercel.app/confidentialite.html</loc></url><url><loc>https://playwise-ps4tvw8g2k-9935s-projects.vercel.app/conditions.html</loc></url></urlset>'''
          write(Path('sitemap.xml'),sitemap)

          # Nettoyage des anciens workflows one-shot.
          for old in ['.github/workflows/add-avis-nav.yml','.github/workflows/add-powered-by.yml','.github/workflows/link-guides.yml','.github/workflows/playwise-v3.yml']:
              q=Path(old)
              if q.exists(): q.unlink()
      - name: Commit V3
        run: |
          git config user.name "PlayWise Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "PlayWise V3 : plateforme complète, règlement et sécurité" || exit 0
          git push
