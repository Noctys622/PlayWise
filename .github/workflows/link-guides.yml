name: Link PlayWise Guides

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/link-guides.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  link-guides:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Relier le bouton Guides
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          replacements = [
              ('<li><a href="#features">Guides</a></li>', '<li><a href="/guides.html">Guides</a></li>'),
              ('href="#features">Guides</a>', 'href="/guides.html">Guides</a>'),
          ]
          changed = False
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new)
                  changed = True
          if not changed:
              print('Lien Guides déjà modifié ou motif non trouvé.')
          p.write_text(text, encoding='utf-8')

      - name: Commit et push
        run: |
          if git diff --quiet; then
            echo "Aucun changement nécessaire"
            exit 0
          fi
          git config user.name "PlayWise Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Relier le bouton Guides à la bibliothèque"
          git push
