name: Ajouter onglet Avis

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-avis-nav.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ajouter Avis aux navigations
        shell: python
        run: |
          from pathlib import Path

          for filename in ['index.html', 'guides.html']:
              p = Path(filename)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              if '/avis.html' in text:
                  print(filename, ': onglet Avis déjà présent')
                  continue

              patterns = [
                  ('<a href="/guides.html">Guides</a>', '<a href="/guides.html">Guides</a><a href="/avis.html">Avis</a>'),
                  ("<a href='/guides.html'>Guides</a>", "<a href='/guides.html'>Guides</a><a href='/avis.html'>Avis</a>"),
              ]

              changed = False
              for old, new in patterns:
                  if old in text:
                      text = text.replace(old, new, 1)
                      changed = True
                      break

              if changed:
                  p.write_text(text, encoding='utf-8')
                  print(filename, ': onglet Avis ajouté')
              else:
                  print(filename, ': lien Guides non trouvé')

      - name: Ajouter Avis au sitemap si présent
        shell: python
        run: |
          from pathlib import Path
          p = Path('sitemap.xml')
          if not p.exists():
              raise SystemExit(0)
          text = p.read_text(encoding='utf-8')
          if '/avis.html' not in text:
              entry = '<url><loc>https://playwise-ps4tvw8g2k-9935s-projects.vercel.app/avis.html</loc></url>'
              text = text.replace('</urlset>', entry + '</urlset>')
              p.write_text(text, encoding='utf-8')

      - name: Commit
        run: |
          if git diff --quiet; then
            echo "Aucun changement nécessaire"
            exit 0
          fi
          git config user.name "PlayWise Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html guides.html sitemap.xml 2>/dev/null || true
          git commit -m "Ajouter l’onglet Avis au site"
          git push
